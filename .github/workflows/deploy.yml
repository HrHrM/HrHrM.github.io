name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Permite lanzarlo a mano desde la pestaña Actions, sin tener que empujar.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Lo exige `deploy-pages`: el despliegue se autentica con OIDC, no con un
  # token guardado en el repositorio.
  id-token: write

# Si se empuja dos veces seguidas, la segunda espera en vez de cancelar a la
# primera: cancelar un despliegue a medias puede dejar el sitio incompleto.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Del `.nvmrc`, para que CI y la máquina de desarrollo no se
          # separen. Con Node 18 el build falla.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Tipos y lint **antes** de construir. Sin esto, un push con un error de
      # tipos publica igual: el build de Vite no comprueba tipos.
      - run: npm run typecheck
      - run: npm run lint

      - run: npm run build

      # Los navegadores pesan bastante y no cambian entre ejecuciones: se
      # cachean por versión de Playwright, que es lo que decide si sirven.
      - name: Versión de Playwright
        id: pw
        run: echo "version=$(node -p "require('./package.json').devDependencies['@playwright/test']")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: pw-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - run: npx playwright install --with-deps chromium firefox
        if: steps.pw-cache.outputs.cache-hit != 'true'
      # Las dependencias del sistema no van en la caché aunque sí el navegador.
      - run: npx playwright install-deps chromium firefox
        if: steps.pw-cache.outputs.cache-hit == 'true'

      # Sustituye al `grep` que había aquí para comprobar el prerender. Aquella
      # comprobación era buena y sigue existiendo, pero ahora dentro de
      # `tests/prerender.spec.ts`, donde además verifica el texto real, las
      # canónicas, el sitemap y el 404 — y junto a las otras 90 pruebas.
      #
      # `SKIP_BUILD` porque el paso de arriba ya construyó: sin esto la
      # configuración de Playwright vuelve a lanzar `npm run build`.
      #
      # Los enlaces de salida quedan fuera (`--grep-invert @external`): dependen
      # de servidores ajenos y un 999 de LinkedIn no debe impedir publicar.
      - name: Pruebas
        run: npm test
        env:
          SKIP_BUILD: '1'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # `dist/client`, no `dist`. El `buildEnd` deja lo servible un nivel
          # por debajo, y publicar `dist` sirve un directorio sin index. Es el
          # error que el CLAUDE.md documenta haber tenido meses con el sitemap.
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
